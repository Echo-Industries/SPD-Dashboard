<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Seattle PD</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/Seattle_Police_Logo.png') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(180deg, #0b1724 0%, #101d2a 100%);
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .brand-badge {
            width: 4rem;
            height: 4rem;
            object-fit: contain;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
    <main class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-md p-8 shadow-2xl">
        <div class="flex items-center gap-4 mb-8">
            <img src="{{ url_for('static', filename='images/Seattle_Police_Logo.png') }}" alt="Seattle Police Department" class="brand-badge">
            <div>
                <p class="text-xs uppercase tracking-[0.25em] text-sky-400 font-semibold">Seattle Police</p>
                <h1 class="text-2xl font-bold text-white">Sign in to continue</h1>
            </div>
        </div>
        <p class="text-sm text-neutral-400 mb-6">A Roblox account is required to access law enforcement records and operational tools.</p>
        <a href="{{ url_for('roblox_login') }}" class="w-full inline-flex items-center justify-center gap-2 bg-blue-700 hover:bg-blue-800 text-white px-4 py-3 rounded-md text-sm font-semibold transition duration-200">
            <i class="fas fa-sign-in-alt"></i>
            <span>Sign in with Roblox</span>
        </a>
    </main>
</body>
</html>
